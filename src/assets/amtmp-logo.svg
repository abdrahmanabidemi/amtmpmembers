<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e623a" />
      <stop offset="100%" stop-color="#083e24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="185" fill="url(#sealGrad)" stroke="#d4af37" stroke-width="8" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
  
  <!-- Inner Background -->
  <circle cx="200" cy="200" r="130" fill="#ffffff" stroke="#d4af37" stroke-width="5" />
  
  <!-- Traditional Medicine Leaf Branch (Left) -->
  <path d="M 160 230 C 140 210 135 180 150 150 C 160 170 170 185 160 230 Z" fill="#2e7d32" opacity="0.85" />
  <path d="M 145 190 C 120 180 115 160 125 135 C 140 150 150 165 145 190 Z" fill="#388e3c" opacity="0.85" />

  <!-- Traditional Medicine Leaf Branch (Right) -->
  <path d="M 240 230 C 260 210 265 180 250 150 C 240 170 230 185 240 230 Z" fill="#2e7d32" opacity="0.85" />
  <path d="M 255 190 C 280 180 285 160 275 135 C 260 150 250 165 255 190 Z" fill="#388e3c" opacity="0.85" />

  <!-- Center Medical Cross & Staff of Healing -->
  <rect x="193" y="110" width="14" height="120" rx="4" fill="#0e623a" />
  <circle cx="200" cy="105" r="12" fill="url(#goldGrad)" />
  
  <!-- Asclepius Snake Motif / Traditional Coil -->
  <path d="M 185 130 Q 215 145 200 165 Q 185 185 215 205" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round" />

  <!-- AMTMP Center Badge Banner -->
  <rect x="110" y="240" width="180" height="42" rx="8" fill="#083e24" stroke="#d4af37" stroke-width="2" />
  <text x="200" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">AMTMP</text>

  <!-- Circular Outer Text Path -->
  <path id="textPathTop" d="M 50 200 A 150 150 0 0 1 350 200" fill="none" />
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ASSOCIATION OF MEDICAL &amp; TRADITIONAL
    </textPath>
  </text>

  <path id="textPathBottom" d="M 350 200 A 150 150 0 0 1 50 200" fill="none" />
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MEDICINE PRACTITIONERS
    </textPath>
  </text>
</svg>
